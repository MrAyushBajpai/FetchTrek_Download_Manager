[package]
name = "fetchtrek-ipc"
version = "0.1.0"
edition = "2021"

[dependencies]
fetchtrek-types = { path = "../fetchtrek-types", features = ["serde"] }
tokio = { version = "1", features = ["io-util", "net", "sync", "macros", "rt", "time"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
