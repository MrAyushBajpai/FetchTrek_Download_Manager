[package]
name = "fetchtrek-persistence"
version = "0.1.0"
edition = "2021"

[dependencies]
fetchtrek-types = { path = "../fetchtrek-types" }
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }
