[package]
name = "fetchtrek-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
fetchtrek-types = { path = "../fetchtrek-types" }
crossbeam-queue = "0.3"
async-trait = "0.1"
tokio = { version = "1", features = ["fs", "rt", "sync", "macros", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
