[package]
name = "fetchtrek-protocols"
version = "0.1.0"
edition = "2021"

[features]
default = ["http", "media", "torrent"]
http = ["dep:reqwest", "dep:tokio-util", "dep:futures-util"]
media = ["http", "dep:quick-xml", "dep:aes", "dep:cbc"]
torrent = []

[dependencies]
fetchtrek-types = { path = "../fetchtrek-types" }
fetchtrek-core = { path = "../fetchtrek-core" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "macros"] }
thiserror = "1.0"

reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
quick-xml = { version = "0.41", optional = true }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true }

[dev-dependencies]
fetchtrek-storage = { path = "../fetchtrek-storage" }

